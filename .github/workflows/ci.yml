name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean

  experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy pandas scikit-learn matplotlib
      - name: Running example and pooled-vs-micro AUC (no downloads)
        working-directory: experiments
        run: |
          python running_example.py
          python pooled_vs_micro_auc.py
